name: 블로그 최신 글 갱신

on:
  schedule:
    # 매일 오전 6시 (한국시간) — GitHub는 UTC 기준이라 21:00 UTC
    - cron: '0 21 * * *'
  workflow_dispatch:        # 필요할 때 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 블로그 RSS 읽어 카드 갱신
        run: python3 tools/update_blog.py index.html

      - name: 바뀐 내용이 있으면 커밋
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name  "blog-bot"
            git config user.email "actions@github.com"
            git add index.html
            git commit -m "블로그 최신 글 갱신"
            git push
          else
            echo "변경 없음"
          fi
